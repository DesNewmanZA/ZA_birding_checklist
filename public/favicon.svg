<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Red-billed oxpecker, black outline on white -->
  <rect width="64" height="64" rx="14" fill="#fff"/>
  <g fill="#fff" stroke="#111" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- branch -->
    <path d="M7 53 H57" fill="none"/>
    <!-- feet -->
    <path d="M30 48 V53 M35 48 V53" fill="none"/>
    <!-- stiff tail -->
    <path d="M40 35 L59 45 L56 50 L36 43 Z"/>
    <!-- body -->
    <ellipse cx="33" cy="38" rx="16" ry="11.5" transform="rotate(25 33 38)"/>
    <!-- belly line -->
    <path d="M24 42 Q28 49 37 47" fill="none" stroke-width="1.8"/>
    <!-- head (drawn over the body) -->
    <circle cx="22" cy="25" r="10.5"/>
    <!-- bill -->
    <path d="M13.5 22 L3 25.5 L13.5 30 Z"/>
    <!-- eye ring -->
    <circle cx="21.5" cy="23.5" r="4.4" stroke-width="2"/>
  </g>
  <!-- pupil -->
  <circle cx="22" cy="23.5" r="1.9" fill="#111"/>
</svg>
